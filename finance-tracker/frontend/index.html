<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finance Tracker</title>
  <style>
    :root { --border: #d8dee9; --accent: #2f6f4f; --danger: #a8342a; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; color: #1f2430; background: #f6f7f9; }
    header { background: var(--accent); color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
    section { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
    form { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); align-items: end; }
    label { display: grid; gap: 4px; font-size: 13px; color: #4a5568; }
    input, select, button { font: inherit; padding: 8px 10px; border-radius: 7px; border: 1px solid var(--border); }
    button { background: var(--accent); color: #fff; border: none; cursor: pointer; font-weight: 500; }
    button:hover { background: #265941; }
    button.ghost { background: transparent; color: var(--danger); border: 1px solid var(--border); padding: 2px 8px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #edf0f4; }
    th { font-weight: 600; color: #4a5568; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
    .amount-income { color: var(--accent); font-variant-numeric: tabular-nums; }
    .amount-expense { color: var(--danger); font-variant-numeric: tabular-nums; }
    .summary { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 16px; }
    .card { border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .card span { display: block; font-size: 12px; color: #4a5568; }
    .card strong { font-size: 18px; font-variant-numeric: tabular-nums; }
    .warnings { margin: 0 0 16px; padding-left: 20px; color: var(--danger); font-size: 13px; }
    .empty { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
<header><h1>Finance Tracker</h1></header>
<main>
  <section>
    <h2>Счета</h2>
    <form id="account-form">
      <label>Название<input name="name" required maxlength="100" placeholder="Основной"></label>
      <label>Начальный баланс<input name="initial_balance" value="0" inputmode="decimal"></label>
      <button type="submit">Добавить счёт</button>
    </form>
    <table>
      <thead><tr><th>Название</th><th>Баланс</th><th></th></tr></thead>
      <tbody id="accounts"></tbody>
    </table>
  </section>

  <section>
    <h2>Операция</h2>
    <form id="operation-form">
      <label>Счёт<select name="account_id" id="account-select" required></select></label>
      <label>Тип
        <select name="type">
          <option value="expense">Расход</option>
          <option value="income">Доход</option>
        </select>
      </label>
      <label>Сумма<input name="amount" required inputmode="decimal" placeholder="100.50"></label>
      <label>Категория<input name="category" required maxlength="64" placeholder="продукты"></label>
      <label>Дата<input name="day" type="date" required></label>
      <button type="submit">Добавить</button>
    </form>
    <table>
      <thead><tr><th>Дата</th><th>Тип</th><th>Категория</th><th>Сумма</th><th></th></tr></thead>
      <tbody id="operations"></tbody>
    </table>
  </section>

  <section>
    <h2>Отчёт за месяц</h2>
    <div class="summary">
      <div class="card"><span>Доходы</span><strong id="r-income">—</strong></div>
      <div class="card"><span>Расходы</span><strong id="r-expense">—</strong></div>
      <div class="card"><span>Сальдо</span><strong id="r-balance">—</strong></div>
      <div class="card"><span>Средний расход</span><strong id="r-average">—</strong></div>
    </div>
    <ul class="warnings" id="r-warnings"></ul>
    <table>
      <thead><tr><th>Категория</th><th>Сумма</th><th>Доля</th></tr></thead>
      <tbody id="r-categories"></tbody>
    </table>
  </section>
</main>
<script>
const API = '';
const money = (v) => v.replace('.', ',') + ' ₽';

async function call(path, options = {}) {
  const response = await fetch(API + path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
  });
  if (response.status === 204) return null;
  const body = await response.json();
  if (!response.ok) throw new Error(body.detail || 'Ошибка запроса');
  return body;
}

function currentMonth() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
}

let accounts = [];

async function loadAccounts() {
  accounts = await call('/api/accounts');
  document.getElementById('accounts').innerHTML = accounts.map((a) => `
    <tr>
      <td>${a.name}</td>
      <td class="amount-income">${money(a.balance)}</td>
      <td><button class="ghost" data-account="${a.id}">удалить</button></td>
    </tr>`).join('') || '<tr><td colspan="3" class="empty">Счетов пока нет</td></tr>';

  document.getElementById('account-select').innerHTML = accounts
    .map((a) => `<option value="${a.id}">${a.name}</option>`).join('');
}

async function loadOperations() {
  const items = await call('/api/operations');
  document.getElementById('operations').innerHTML = items.map((op) => `
    <tr>
      <td>${op.day}</td>
      <td>${op.type === 'income' ? 'Доход' : 'Расход'}</td>
      <td>${op.category}</td>
      <td class="${op.type === 'income' ? 'amount-income' : 'amount-expense'}">${money(op.amount)}</td>
      <td><button class="ghost" data-operation="${op.id}">удалить</button></td>
    </tr>`).join('') || '<tr><td colspan="5" class="empty">Операций пока нет</td></tr>';
}

async function loadReport() {
  const report = await call(`/api/reports/monthly?month=${currentMonth()}`);
  document.getElementById('r-income').textContent = money(report.income);
  document.getElementById('r-expense').textContent = money(report.expense);
  document.getElementById('r-balance').textContent = money(report.balance);
  document.getElementById('r-average').textContent = money(report.average_expense);
  document.getElementById('r-warnings').innerHTML =
    report.warnings.map((w) => `<li>${w}</li>`).join('');
  document.getElementById('r-categories').innerHTML =
    Object.entries(report.categories).map(([name, amount]) => `
      <tr><td>${name}</td><td>${money(amount)}</td>
      <td>${report.top_category && report.top_category.name === name ? report.top_category.share + ' %' : ''}</td></tr>
    `).join('') || '<tr><td colspan="3" class="empty">Расходов нет</td></tr>';
}

function showError(error) { alert(error.message); }

async function refresh() {
  try {
    await loadAccounts();
    await loadOperations();
    await loadReport();
  } catch (error) { showError(error); }
}

document.getElementById('account-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  try {
    await call('/api/accounts', { method: 'POST', body: JSON.stringify(data) });
    event.target.reset();
    await refresh();
  } catch (error) { showError(error); }
});

document.getElementById('operation-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const data = Object.fromEntries(new FormData(event.target));
  try {
    await call('/api/operations', { method: 'POST', body: JSON.stringify(data) });
    event.target.reset();
    await refresh();
  } catch (error) { showError(error); }
});

document.addEventListener('click', async (event) => {
  const accountId = event.target.dataset.account;
  const operationId = event.target.dataset.operation;
  try {
    if (accountId) await call(`/api/accounts/${accountId}`, { method: 'DELETE' });
    if (operationId) await call(`/api/operations/${operationId}`, { method: 'DELETE' });
    if (accountId || operationId) await refresh();
  } catch (error) { showError(error); }
});

const dayInput = document.querySelector('input[name="day"]');
dayInput.value = new Date().toISOString().slice(0, 10);
refresh();
</script>
</body>
</html>
